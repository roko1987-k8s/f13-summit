apiVersion: container.gcp.m.upbound.io/v1beta1
kind: Cluster
metadata:
  name: gke-${{ values.name }}-${{ values.environment }}
  labels:
    platform.example.com/cloud: gcp
    platform.example.com/application: ${{ values.name }}
spec:
  deletionPolicy: Delete
  forProvider:
    project: ${{ values.projectId }}
    location: ${{ values.region }}
    network: ${{ values.network }}
    subnetwork: ${{ values.subnetwork }}
    deletionProtection: ${{ values.environment == 'prod' }}
    releaseChannel:
      - channel: REGULAR
    privateClusterConfig:
      - enablePrivateNodes: true
        enablePrivateEndpoint: ${{ values.enablePrivateCluster }}
        masterIpv4CidrBlock: 172.16.0.0/28
    workloadIdentityConfig:
      - workloadPool: ${{ values.projectId }}.svc.id.goog
    networkPolicy:
      - enabled: ${{ values.enableNetworkPolicy }}
        provider: CALICO
    binaryAuthorization:
      - evaluationMode: PROJECT_SINGLETON_POLICY_ENFORCE
    loggingService: logging.googleapis.com/kubernetes
    monitoringService: monitoring.googleapis.com/kubernetes
    resourceLabels:
      owner: ${{ values.owner }}
      environment: ${{ values.environment }}
  providerConfigRef:
    name: gcp-platform
---
apiVersion: container.gcp.m.upbound.io/v1beta1
kind: NodePool
metadata:
  name: gke-${{ values.name }}-${{ values.environment }}-system
spec:
  forProvider:
    project: ${{ values.projectId }}
    location: ${{ values.region }}
    cluster: gke-${{ values.name }}-${{ values.environment }}
    initialNodeCount: 2
    autoscaling:
      - minNodeCount: 2
        maxNodeCount: 6
    management:
      - autoRepair: true
        autoUpgrade: true
    nodeConfig:
      - machineType: e2-standard-4
        diskType: pd-balanced
        diskSizeGb: 100
        imageType: COS_CONTAINERD
        oauthScopes:
          - https://www.googleapis.com/auth/cloud-platform
        workloadMetadataConfig:
          - mode: GKE_METADATA
  providerConfigRef:
    name: gcp-platform
