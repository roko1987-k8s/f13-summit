apiVersion: apps/v1
kind: Deployment
metadata:
  name: kind-game
spec:
  replicas: 1
  selector:
    matchLabels: {app: kind-game}
  template:
    metadata:
      labels: {app: kind-game}
    spec:
      containers:
      - name: kind-game
        image: kind-game:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: GAME_DURATION
          value: "30"
        ports:
        - containerPort: 443
        readinessProbe:
          httpGet: {path: /api/state, port: 443}
        livenessProbe:
          httpGet: {path: /api/state, port: 443}
---
apiVersion: v1
kind: Service
metadata:
  name: kind-game
spec:
  selector: {app: kind-game}
  ports:
  - port: 443
    targetPort: 443
  type: ClusterIP
