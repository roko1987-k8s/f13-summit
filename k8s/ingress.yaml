apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kind-game
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SSE: sin buffering y con timeouts largos para el stream.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  tls:
    - hosts:
        - game.tudominio.com
      secretName: kind-game-tls
  rules:
    - host: game.tudominio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kind-game
                port:
                  number: 80
